<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalkulator Ichimoku · Ichimoku Trader</title>
<meta name="description" content="Kalkulator Ichimoku: cele cenowe V, N, E, NT, cykle czasowe Hosody, liczby równe (taitō sūchi) i zasięg fal.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☁️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=Shippori+Mincho:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --surface-2:#F5F7FA; --ink:#16233B; --ink-2:#4A5A75; --line:#D5DCE7;
  --indigo:#24467A; --indigo-soft:#E3EAF5; --bull:#1F7A65; --bull-soft:#E1F1EC; --bear:#A8432F; --bear-soft:#F6E6E1;
  --gold:#D9A521; --gold-soft:#FBF1D5; --focus:#2F6FD6; --sun:#E60012; --sun-soft:#FDE3E5;
  --serif:"Spectral",Georgia,"Times New Roman",serif;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --jp:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1524; --surface:#142036; --surface-2:#1A2843; --ink:#E5EAF3; --ink-2:#9FB0CA; --line:#2A3B5A;
    --indigo:#8FB0E6; --indigo-soft:#1F3254; --bull:#4FC1A3; --bull-soft:#173A36; --bear:#E58B74; --bear-soft:#3E2523;
    --gold:#E8BC4A; --gold-soft:#3A3220; --focus:#7FA8F0; --sun:#F0303E; --sun-soft:#43202A;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1524; --surface:#142036; --surface-2:#1A2843; --ink:#E5EAF3; --ink-2:#9FB0CA; --line:#2A3B5A;
  --indigo:#8FB0E6; --indigo-soft:#1F3254; --bull:#4FC1A3; --bull-soft:#173A36; --bear:#E58B74; --bear-soft:#3E2523;
  --gold:#E8BC4A; --gold-soft:#3A3220; --focus:#7FA8F0; --sun:#F0303E; --sun-soft:#43202A;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.num,input,td.n{font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* brand band – fixed dark so the white logo always reads */
.band{background:#121C30;color:#EEF2F8;border-bottom:3px solid var(--sun)}
.bandin{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:28px;align-items:center;padding-top:22px;padding-bottom:22px}
.logo{display:block;line-height:0;border-radius:8px}
.logo img{height:116px;width:auto;display:block}
.herotxt h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,4vw,2.9rem);line-height:1.05;margin:0 0 8px;letter-spacing:-.01em;color:#fff}
.herotxt p{margin:0;color:#B8C4D8;max-width:58ch;font-size:.95rem}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;align-self:start}
.backbtn{display:inline-flex;gap:8px;align-items:center;padding:8px 14px;border-radius:999px;background:var(--sun);color:#fff;text-decoration:none;font-weight:600;font-size:.88rem}
.backbtn:hover{background:#C9000F}
.band .seg{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.18)}
.band .seg button{color:#B8C4D8}
.band .seg button[aria-pressed="true"]{background:#fff;color:#121C30}
.band .iconbtn{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.18);color:#fff}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:36px;height:36px;cursor:pointer;display:grid;place-items:center}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:999px;cursor:pointer;font-size:.85rem;color:var(--ink-2)}
@media (max-width:860px){.bandin{grid-template-columns:1fr;gap:16px}.tools{justify-content:flex-start;order:-1}.logo img{height:96px}}
header.top{padding:8px 0 0}

/* nav */
nav.tabs{display:flex;gap:28px;flex-wrap:wrap;padding:18px 0 0}
.group{display:flex;flex-direction:column;gap:6px}
.group > span{font-size:.78rem;color:var(--ink-2);font-weight:500;padding-left:2px}
.group > span b{font-family:var(--jp);font-weight:600;color:var(--indigo);margin-right:6px}
.group .row{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:500;color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

main{padding:26px 0 40px}
section.panel{display:none}
section.panel.on{display:block}
.lead{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
.lead h2{font-family:var(--serif);font-weight:600;font-size:1.75rem;margin:0;line-height:1.15}
.lead p{margin:6px 0 0;color:var(--ink-2);max-width:68ch}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px}
@media (max-width:860px){.grid2{grid-template-columns:1fr!important}}

/* inputs: gold = "fill me" heritage of the spreadsheet's yellow cells */
label.f{display:flex;flex-direction:column;gap:5px;font-size:.85rem;color:var(--ink-2);font-weight:500}
label.f input,textarea{background:var(--gold-soft);border:1px solid transparent;border-bottom:2px solid var(--gold);border-radius:8px 8px 4px 4px;padding:9px 11px;font-size:1.05rem;color:var(--ink);min-width:0;width:100%}
label.f input:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 30%,transparent)}
label.f .pt{font-family:var(--serif);font-weight:700;color:var(--ink);font-size:1rem}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:340px){.fields{grid-template-columns:1fr}}
.hint{font-size:.82rem;color:var(--ink-2);margin:10px 0 0}
.warn{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--bear-soft);color:var(--bear);font-size:.88rem;display:none}
.warn.on{display:block}

/* wave chart */
.chart{margin-top:16px;background:var(--surface-2);border-radius:10px;overflow:hidden}
.chart svg{display:block;width:100%;height:auto}
.chart .leg{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linejoin:round}
.chart .proj{stroke:var(--indigo);stroke-width:2;stroke-dasharray:6 5;fill:none}
.chart .lvl{stroke:var(--line);stroke-width:1}
.chart .lvl.act{stroke:var(--indigo);stroke-width:1.5}
.chart .lbl{font:600 13px var(--sans);fill:var(--ink-2)}
.chart .lbl.act{fill:var(--indigo)}
.chart .pt{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.chart .ptl{font:700 14px var(--serif);fill:var(--ink)}
.chart .ptv{font:500 11px var(--sans);fill:var(--ink-2)}

/* results */
.res{display:flex;flex-direction:column;gap:8px}
.r{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.r:hover{border-color:var(--indigo)}
.r[aria-pressed="true"]{border-color:var(--indigo);background:var(--indigo-soft)}
.r .k{font-family:var(--serif);font-weight:700;font-size:1.45rem;color:var(--indigo);line-height:1}
.r .f{font-size:.8rem;color:var(--ink-2)}
.r .f b{display:block;font-size:.92rem;color:var(--ink);font-weight:600}
.r .v{font-size:1.25rem;font-weight:600;text-align:right}
.r .d{display:block;font-size:.78rem;color:var(--ink-2);font-weight:400}
.up .r .d{color:var(--bull)} .down .r .d{color:var(--bear)}
.mids{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.mid{padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:.8rem;color:var(--ink-2)}
.mid strong{display:block;font-size:1.02rem;color:var(--ink);font-weight:600}
h3{font-family:var(--serif);font-weight:600;font-size:1.1rem;margin:20px 0 10px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{font-weight:500;color:var(--ink-2);font-size:.8rem;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}
.toggle{display:inline-flex;gap:8px;align-items:center;font-size:.88rem;color:var(--ink-2);cursor:pointer}
.toggle input{accent-color:var(--indigo);width:16px;height:16px}

.dirseg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.dirseg button{border:0;background:none;padding:9px 16px;cursor:pointer;font-weight:500;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.dirseg button[aria-pressed="true"].u{background:var(--bull-soft);color:var(--bull)}
.dirseg button[aria-pressed="true"].d{background:var(--bear-soft);color:var(--bear)}

/* cycles */
.cyc td .ds{font-size:.82rem;color:var(--ink-2);max-width:34ch}
.cyc tr.past td{color:var(--ink-2)}
.cyc tr.next td{background:var(--indigo-soft)}
.tag{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag.s{background:var(--indigo-soft);color:var(--indigo)}
.when{font-size:.78rem;color:var(--ink-2);display:block}
.timeline{position:relative;height:100px;margin:8px 6px 4px}
.timeline .axis{position:absolute;left:0;right:0;top:44px;height:2px;background:var(--line)}
.timeline .dot{position:absolute;top:38px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--surface);border:2px solid var(--indigo)}
.timeline .dot.past{border-color:var(--line);background:var(--surface-2)}
.timeline .dot.next{background:var(--indigo)}
.timeline .tn{position:absolute;top:14px;transform:translateX(-50%);font:600 .74rem var(--sans);color:var(--ink-2)}
.timeline .today{position:absolute;top:32px;height:26px;width:2px;background:var(--gold);margin-left:-1px}
.timeline .today span{position:absolute;top:46px;background:var(--surface);padding:0 4px;color:var(--gold)!important;font-weight:600;left:50%;transform:translateX(-50%);font-size:.7rem;color:var(--ink-2);white-space:nowrap}
.timeline .scale{position:absolute;top:62px;font-size:.7rem;color:var(--ink-2)}
.big{font-family:var(--serif);font-size:2rem;font-weight:600;line-height:1.1}
.out{margin-top:16px;padding:16px;border-radius:12px;background:var(--indigo-soft)}
.out .lab{font-size:.82rem;color:var(--ink-2)}
.flow{display:flex;flex-direction:column;gap:12px}
.arrow{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:.85rem;padding-left:4px}
.arrow::before{content:"";width:2px;height:22px;background:var(--line);margin-left:10px}

/* cycle sync */
.sync{margin-top:18px}
.syncctl{display:flex;gap:10px;flex-wrap:wrap}
.sel{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--ink-2);font-weight:500}
.sel input{background:var(--gold-soft);border:0;border-bottom:2px solid var(--gold);border-radius:8px 8px 2px 2px;padding:7px 10px;font-size:.9rem;width:150px}
.sel select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:.9rem;color:var(--ink)}
.months{position:relative;height:22px;margin:10px 0 2px 266px}
.months span{position:absolute;transform:translateX(-50%);font-size:.72rem;color:var(--ink-2);white-space:nowrap}
.lane{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.lane-in{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center}
.lane-in .no{font-family:var(--serif);font-weight:700;color:var(--indigo);width:20px;text-align:center}
.lane-in input{background:var(--gold-soft);border:0;border-bottom:2px solid var(--gold);border-radius:6px 6px 2px 2px;padding:6px 8px;font-size:.9rem;min-width:0;width:100%}
.lane-in input.note{background:transparent;border-bottom:1px solid var(--line);font-size:.8rem;grid-column:2/4;padding:3px 8px}
.lane-in .main{font-size:.9rem;font-weight:600}
.lane-in .main small{display:block;font-weight:400;color:var(--ink-2);font-size:.76rem}
.track{position:relative;height:46px;background:var(--surface-2);border-radius:8px;overflow:hidden}
.track .ax{position:absolute;left:0;right:0;top:30px;height:1px;background:var(--line)}
.track .cb{position:absolute;top:0;bottom:0;min-width:4px;background:var(--sun-soft);border-left:1px solid var(--sun);border-right:1px solid var(--sun)}
.track .sd{position:absolute;top:24px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--surface);border:2px solid var(--indigo)}
.track .sd.hit{background:var(--sun);border-color:var(--sun);box-shadow:0 0 0 3px var(--sun-soft)}
.track .sn{position:absolute;top:5px;transform:translateX(-50%);font:600 .72rem var(--sans);color:var(--ink-2)}
.track .sn.hit{color:var(--sun)}
.track .empty{position:absolute;inset:0;display:grid;place-items:center;font-size:.78rem;color:var(--ink-2)}
.track .empty span{background:var(--surface-2);padding:2px 10px;border-radius:999px;position:relative;z-index:1}
.clear{border:0;background:none;color:var(--ink-2);cursor:pointer;font-size:1rem;padding:2px 6px;border-radius:6px}
.clear:hover{color:var(--bear)}
.conf td{vertical-align:middle}
.conf tr.first td{background:var(--sun-soft)}
.pow{display:inline-grid;place-items:center;min-width:34px;height:26px;padding:0 8px;border-radius:999px;background:var(--sun);color:#fff;font-weight:700;font-size:.85rem}
.chip{display:inline-block;margin:2px 4px 2px 0;padding:2px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:.78rem;white-space:nowrap}
.chip b{font-family:var(--serif)}
.cmark{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--sun);color:#fff;font-size:.7rem;font-weight:600;vertical-align:middle}
.syncnote{padding:14px;border-radius:10px;background:var(--surface-2);color:var(--ink-2);font-size:.9rem}
@media (max-width:760px){.lane{grid-template-columns:1fr;gap:8px}.months{margin-left:0}.months span.alt{display:none}}

/* width legs */
.legs td input{background:var(--gold-soft);border:0;border-bottom:2px solid var(--gold);border-radius:6px 6px 2px 2px;padding:7px 9px;width:100%;min-width:90px;text-align:right}
.eqmark{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--indigo)}
.btn.primary{background:var(--indigo);color:var(--surface);border-color:var(--indigo)}
.del{border:0;background:none;color:var(--ink-2);cursor:pointer;font-size:1.1rem;padding:4px 8px;border-radius:6px}
.del:hover{color:var(--bear)}

/* settings */
details.settings{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
details.settings summary{cursor:pointer;padding:16px 20px;font-weight:600;list-style:none;display:flex;justify-content:space-between}
details.settings summary::after{content:"+";color:var(--ink-2);font-weight:400}
details.settings[open] summary::after{content:"–"}
details.settings .in{padding:0 20px 20px;display:grid;gap:14px}
textarea{font-size:.9rem;min-height:84px;resize:vertical;font-family:var(--sans)}

footer{border-top:1px solid var(--line);padding:22px 0 36px;color:var(--ink-2);font-size:.85rem}
footer .bar{align-items:flex-start}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:.9rem;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.printbtn{display:inline-flex;gap:7px;align-items:center;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);color:#fff;font-weight:600;font-size:.88rem;cursor:pointer}
.printbtn:hover{background:rgba(255,255,255,.16)}
dialog{border:0;border-radius:16px;padding:0;background:var(--surface);color:var(--ink);width:min(520px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(8,14,28,.35)}
dialog::backdrop{background:rgba(10,16,30,.55)}
.dlg{padding:22px;display:grid;gap:14px}
.dlg h2{font-family:var(--serif);font-weight:600;font-size:1.4rem;margin:0}
.dlg fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 14px 12px;display:grid;gap:8px}
.dlg legend{font-size:.82rem;color:var(--ink-2);padding:0 4px}
.dlg .hint{margin:0}
.dlgbtns{display:flex;justify-content:flex-end;gap:8px}
.printhead{display:none}
.ph-band{display:flex;gap:16px;align-items:center;background:#121C30;color:#fff;border-bottom:3px solid #E60012;border-radius:8px;padding:10px 16px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ph-band img{height:64px;width:auto}
.ph-title{font-family:var(--serif);font-size:20px;font-weight:600}
.ph-meta{font-size:10px;color:#B8C4D8;margin-top:2px}
.ph-disc{font-size:9.5px;color:#B8C4D8;margin-top:2px}
.ph-notes{white-space:pre-wrap;margin:10px 0 0;padding:10px 12px;border-left:3px solid var(--gold);background:var(--surface-2);font-size:11px}
.ph-notes:empty{display:none}
.lyopt{display:grid;gap:8px}

/* ===== one-page summary (applied on screen for measuring and in print) ===== */
body.op{--bg:#fff;--surface:#fff;--surface-2:#F3F5F8;--ink:#16233B;--ink-2:#4A5A75;--line:#D5DCE7;--indigo:#24467A;--indigo-soft:#E8EEF7;--bull:#1F7A65;--bull-soft:#E1F1EC;--bear:#A8432F;--bear-soft:#F6E6E1;--gold:#C9971A;--gold-soft:#FBF4E0;--sun:#E60012;--sun-soft:#FDE3E5;background:#fff;color:var(--ink);font-size:10px;line-height:1.3}
body.op *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body.op .band,body.op nav.tabs,body.op details.settings,body.op footer,body.op .toast,body.op .lead p,body.op p.hint,body.op .dirseg button[aria-pressed="false"],body.op .multhead .toggle,body.op #addLeg,body.op .del,body.op .clear,body.op .lane.nodate,body.op .out.noval,body.op #cycTbl th:nth-child(n+4),body.op #cycTbl td:nth-child(n+4),body.op #p-cycles>.lead,body.op .poff,body.op #confList tbody tr:nth-child(n+7){display:none!important}
body.op #p-cycles.ponlysync>.grid2{display:none!important}
body.op>.wrap{max-width:none;padding:0;margin:0}
body.op header.top{padding:0}
body.op .printhead{display:block;margin-bottom:6px}
body.op .ph-band{padding:5px 12px;gap:12px;border-radius:6px}
body.op .ph-band img{height:46px}
body.op .ph-title{font-size:15px}
body.op .ph-meta,body.op .ph-disc{font-size:8px}
body.op .ph-notes{margin-top:5px;padding:4px 8px;font-size:9px}
body.op main{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 10px;align-items:start;padding:0}
body.op #p-targets{grid-column:1;grid-row:1}
body.op #p-width{grid-column:2;grid-row:2}
body.op #p-cycles{display:contents!important}
body.op #p-cycles>.grid2{grid-column:2;grid-row:1}
body.op #p-taito{grid-column:1;grid-row:2}
body.op #syncCard{grid-column:1/-1;grid-row:3;margin-top:0}
body.op section.panel{display:block!important;margin:0!important}
body.op .lead{margin-bottom:3px;gap:6px}
body.op .lead h2{font-size:12.5px}
body.op h3{font-size:10.5px;margin:5px 0 3px}
body.op .card{padding:7px;border-radius:6px}
body.op .grid2{grid-template-columns:minmax(0,1fr)!important;gap:5px}
body.op #p-taito .grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important}
body.op .dirseg button{padding:2px 8px;font-size:9px}
body.op label.f{font-size:8.5px;gap:1px}
body.op label.f input{font-size:10px;padding:2px 6px}
body.op .fields{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:6px}
body.op .chart{margin-top:5px}
body.op .chart svg{max-height:150px}
body.op .warn{font-size:8.5px;padding:3px 6px;margin-top:4px}
body.op #p-targets .res{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:5px}
body.op .r{padding:3px 6px;grid-template-columns:22px minmax(0,1fr) auto;gap:5px;border-radius:5px}
body.op .r .k{font-size:12px}
body.op .r .f{font-size:7.5px}
body.op .r .f b{font-size:8.5px}
body.op .r .v{font-size:10.5px}
body.op .r .d{font-size:7.5px}
body.op .mids{gap:4px;margin-top:0}
body.op .mid{padding:3px 6px;font-size:8px;border-radius:5px}
body.op .mid strong{font-size:10px}
body.op .multhead{margin-top:5px!important}
body.op table{font-size:8.5px}
body.op td,body.op th{padding:1.5px 4px}
body.op th{font-size:7.5px}
body.op .legs td:first-child{white-space:nowrap}
body.op .eqmark{width:7px;height:7px;margin-right:3px}
body.op .tag{font-size:7.5px;padding:0 5px}
body.op .when{font-size:7.5px}
body.op .cmark{font-size:7px;padding:0 4px;margin-left:3px}
body.op #cycTbl td b{font-size:10px!important}
body.op .legs td input{padding:1px 4px;font-size:9px;min-width:50px}
body.op .timeline{height:96px;margin:0 6px}
body.op .timeline .tn{font-size:8px}
body.op .big{font-size:14px}
body.op .out{margin-top:5px;padding:5px 8px;border-radius:6px}
body.op .out .lab{font-size:8px}
body.op .flow{gap:3px}
body.op .arrow{font-size:8px}
body.op .arrow::before{height:8px}
body.op #p-cycles .grid2>.card:first-child{padding:5px 7px}
body.op .sync .lead{margin-bottom:0}
body.op .syncctl{gap:6px}
body.op .sel{font-size:8px;gap:1px}
body.op .sel select,body.op .sel input{font-size:9px;padding:2px 5px;width:auto}
body.op .lane{grid-template-columns:150px minmax(0,1fr);gap:8px;padding:2px 0}
body.op .months{margin:3px 0 0 158px;height:14px}
body.op .months span{font-size:7.5px}
body.op .lane-in{gap:3px}
body.op .lane-in input{font-size:9px;padding:1px 5px}
body.op .lane-in input.note{font-size:8px;padding:0 5px}
body.op .lane-in .main{font-size:9px}
body.op .lane-in .main small{font-size:7.5px}
body.op .track{height:30px;border-radius:5px}
body.op .track .ax{top:21px}
body.op .track .sd{top:16px;width:9px;height:9px;margin-left:-4.5px}
body.op .track .sn{top:2px;font-size:7.5px}
body.op .track .empty{font-size:7.5px}
body.op .chip{font-size:7.5px;padding:0 5px;margin:1px 3px 1px 0}
body.op .pow{min-width:22px;height:16px;font-size:8.5px}
body.op .syncnote{padding:5px 8px;font-size:8.5px}

@page{size:A4;margin:12mm}
@media print{
  :root:not(#_p){--bg:#fff;--surface:#fff;--surface-2:#F3F5F8;--ink:#16233B;--ink-2:#4A5A75;--line:#D5DCE7;--indigo:#24467A;--indigo-soft:#E8EEF7;--bull:#1F7A65;--bull-soft:#E1F1EC;--bear:#A8432F;--bear-soft:#F6E6E1;--gold:#C9971A;--gold-soft:#FBF4E0;--sun:#E60012;--sun-soft:#FDE3E5}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;font-size:12px}
  .band,nav.tabs,details.settings,.toast,dialog,#addLeg,.del,.clear,.hint[data-t="chartHint"],.toggle:has(#multChart),.dirseg button[aria-pressed="false"],.lead .btn{display:none!important}
  .wrap{max-width:none;padding:0}
  header.top{padding:0}
  .printhead{display:block;margin-bottom:10px}
  main{padding:8px 0 0}
  section.panel{display:block!important;margin:0 0 18px}
  .lead{break-after:avoid}
  body.printing section.panel.poff,body.printing #syncCard.poff{display:none!important}
  .card{border-radius:8px;padding:12px}
  #p-targets .card,#p-taito .card,.res,.mids{break-inside:avoid}
  .lane.nodate,.out.noval{display:none!important}
  #p-cycles .grid2>.card:first-child .hint{display:none}
  .lead{margin-bottom:8px}.lead h2{font-size:18px}.lead p{font-size:11px}
  .grid2{grid-template-columns:1fr!important;gap:10px}
  #p-targets .res{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  #p-taito .grid2{grid-template-columns:1fr 1fr!important}
  .chart svg{max-height:300px}
  .r{padding:7px 10px;break-inside:avoid}.r .k{font-size:1.1rem}.r .v{font-size:1rem}
  table{font-size:10.5px}td,th{padding:5px 6px}
  tr,.lane{break-inside:avoid}
  input,textarea,select{border:0!important;box-shadow:none!important}
  .sync{margin-top:12px}
  .lanes{break-inside:avoid}
  h3,.months,.multhead,.syncctl,.sync .lead{break-after:avoid}
  #multTbl,#confList table{break-inside:avoid}
  .lane{grid-template-columns:190px minmax(0,1fr)}
  .months{margin-left:206px}
  .timeline{break-inside:avoid}
  footer{display:none}
  body.printing #p-cycles.ponlysync > .grid2{display:none!important}
}
</style>

const LOC={pl:"pl-PL",it:"it-IT",en:"en-GB"};

/* ---------- state ---------- */
const DAY=864e5;
function todayDN(){const n=new Date();return Math.floor(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())/DAY)}
function iso(dn){return new Date(dn*DAY).toISOString().slice(0,10)}
function parseISO(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s||""))return null;const [y,m,d]=s.split("-").map(Number);const t=Date.UTC(y,m-1,d);return isNaN(t)?null:Math.round(t/DAY)}
function defaults(){
  const lang=(navigator.language||"pl").slice(0,2);
  return {lang:T[lang]?lang:"pl",tab:"targets",dir:"up",
    up:{A:"1.27901",B:"1.32804",C:"1.30361"},down:{A:"149.5",B:"146",C:"147.39"},sel:"V",mult:false,
    legs:[["120.76","124.13"],["124.13","122.22"],["119.46","122.12"],["124.13","122.22"]],
    cyc:iso(todayDN()),custom:"",
    tb:{s:"2015-08-24",c:"2015-10-23"},th:{s:"2013-05-22",c:"2013-06-13",h:"2013-07-08"},
    holStd:true,holExtra:"",day1:true,
    sync:{rows:[0,1,2,3,4].map(()=>({d:"",l:""})),months:12,tol:1,extra:""},
    pr:{name:"",notes:"",layout:"one",sec:{targets:true,width:true,cycles:true,sync:true,taito:true}}};
}
let S=defaults();
function fixState(){const dp=defaults().pr;S.pr=Object.assign({},dp,S.pr||{});S.pr.sec=Object.assign({},dp.sec,S.pr.sec||{});const d=defaults().sync;S.sync=Object.assign({},d,S.sync||{});if(!Array.isArray(S.sync.rows)||S.sync.rows.length!==5)S.sync.rows=d.rows}
function load(){
  try{const h=location.hash.match(/s=([^&]+)/);if(h){const o=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(h[1])))));S=Object.assign(defaults(),o);return}}catch(e){}
  try{const v=localStorage.getItem("ichimokuCalc.v1");if(v)S=Object.assign(defaults(),JSON.parse(v))}catch(e){}
}
function save(){try{localStorage.setItem("ichimokuCalc.v1",JSON.stringify(S))}catch(e){}}
const t=(k,v)=>{let s=(T[S.lang]||T.pl)[k]??T.pl[k]??k;if(v)for(const x in v)s=s.replace("{"+x+"}",v[x]);return s};
const $=id=>document.getElementById(id);

/* ---------- number helpers ---------- */
function num(s){if(s==null)return NaN;s=String(s).trim().replace(/\s/g,"").replace(",",".");return s===""?NaN:Number(s)}
function decs(s){s=String(s||"").replace(",",".");const i=s.indexOf(".");return i<0?0:s.length-i-1}
function fmt(x,d){return isFinite(x)?x.toFixed(d):"–"}
function pipInfo(d){return d>=4?{p:1e-4,u:"pips"}:d>=2?{p:1e-2,u:"pips"}:{p:1,u:"pts"}}

/* ---------- business days ---------- */
function holSet(){const set=new Set();(S.holExtra||"").split(/[\s,;]+/).forEach(x=>{const d=parseISO(x);if(d!=null)set.add(d)});return set}
let HOL=new Set();
function isBiz(dn){const w=(dn+4)%7;if(w===0||w===6)return false;if(S.holStd){const d=new Date(dn*DAY),m=d.getUTCMonth(),dd=d.getUTCDate();if((m===0&&dd===1)||(m===11&&dd===25))return false}return !HOL.has(dn)}
function workday(start,n){let d=start;const step=n<0?-1:1;n=Math.abs(n);while(n>0){d+=step;if(isBiz(d))n--}return d}
function networkdays(a,b){if(a>b)return -networkdays(b,a);let c=0;for(let d=a;d<=b;d++)if(isBiz(d))c++;return c}
function fdate(dn,opt){return new Date(dn*DAY).toLocaleDateString(LOC[S.lang],Object.assign({timeZone:"UTC",weekday:"short",day:"numeric",month:"short",year:"numeric"},opt||{}))}
function rel(dn){const d=dn-todayDN();return d===0?t("isToday"):d>0?t("inDays",{n:d}):t("daysAgo",{n:-d})}

/* ---------- PRICE TARGETS ---------- */
function calcTargets(A,B,C){
  const V=B+(B-C),N=C+(B-A),E=B+(B-A),NT=C+(C-A);
  const mV=[],mE=[];for(let k=2;k<=7;k++){mV.push(B+(B-C)*k);mE.push(A+(B-A)*(k+1))}
  return {V,N,E,NT,mids:{VN:(V+N)/2,VE:(V+E)/2,NE:(N+E)/2},mV,mE};
}
function renderTargets(){
  const P=S[S.dir],up=S.dir==="up";
  $("tgtWrap").className="grid2 "+S.dir;
  document.querySelectorAll(".dirseg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.dir===S.dir));
  ["A","B","C"].forEach(k=>{const el=$("in"+k);if(document.activeElement!==el)el.value=P[k];document.querySelector('[data-t-dyn="lbl'+k+'"]').textContent=t((up?"up":"down")+k)});
  const A=num(P.A),B=num(P.B),C=num(P.C);
  const w=$("tgtWarn");
  const D=Math.max(2,decs(P.A),decs(P.B),decs(P.C));
  if(![A,B,C].every(isFinite)){w.textContent=t("warnNum");w.classList.add("on");$("tgtRes").innerHTML="";$("tgtMids").innerHTML="";$("multTbl").innerHTML="";$("waveChart").innerHTML="";return}
  const ok=up?(A<C&&C<B):(A>C&&C>B);
  w.textContent=t(up?"warnUp":"warnDown");w.classList.toggle("on",!ok);
  const R=calcTargets(A,B,C),pi=pipInfo(D),unit=pi.u==="pips"?t("pips"):t("pts");
  const items=[["V","fV","B + (B − C)",R.V],["N","fN","C + (B − A)",R.N],["E","fE","B + (B − A)",R.E],["NT","fNT","C + (C − A)",R.NT]];
  if(!up){items[0][2]="B − (C − B)";items[1][2]="C − (A − B)";items[2][2]="B − (A − B)";items[3][2]="C − (A − C)"}
  $("tgtRes").innerHTML=items.map(([k,fk,f,v])=>{const dist=(v-C)/pi.p;
    return `<button class="r" data-sel="${k}" aria-pressed="${S.sel===k}"><span class="k">${k}</span><span class="f"><b>${t(fk)}</b>${f}</span><span class="v num">${fmt(v,D)}<span class="d">${dist>=0?"+":"−"}${Math.abs(dist).toFixed(pi.u==="pips"?1:D)} ${unit} ${t("fromC")}</span></span></button>`}).join("");
  $("tgtMids").innerHTML=[["V–N",R.mids.VN],["V–E",R.mids.VE],["N–E",R.mids.NE]].map(([l,v])=>`<div class="mid">${l}<strong class="num">${fmt(v,D+1)}</strong></div>`).join("");
  let rows=`<thead><tr><th></th><th class="n">V</th><th class="n">E</th></tr></thead><tbody>`;
  for(let i=0;i<6;i++){const k=i+2;rows+=`<tr><td><b>${k}</b> <span class="tag">${t("times")}${k+1}</span></td><td class="n">${k}V&nbsp; <span class="num">${fmt(R.mV[i],D)}</span></td><td class="n">${k}E&nbsp; <span class="num">${fmt(R.mE[i],D)}</span></td></tr>`}
  $("multTbl").innerHTML=rows+"</tbody>";
  drawWave(A,B,C,R,D);
}
function drawWave(A,B,C,R,D){
  const W=760,pad=26,xA=56,xB=200,xC=310,xT=480,xL=630;
  const lv=[["V",R.V],["N",R.N],["E",R.E],["NT",R.NT]];
  if(S.mult){for(let i=0;i<6;i++){lv.push([(i+2)+"V",R.mV[i]]);lv.push([(i+2)+"E",R.mE[i]])}}
  const H=Math.max(340,lv.length*17+60);
  const all=[A,B,C].concat(lv.map(x=>x[1]));
  let lo=Math.min(...all),hi=Math.max(...all);const sp=(hi-lo)||1;lo-=sp*.06;hi+=sp*.06;
  const y=v=>pad+(hi-v)/(hi-lo)*(H-pad*2);
  // label de-collision
  const L=lv.map(([k,v])=>({k,v,y:y(v),ly:y(v)})).sort((a,b)=>a.y-b.y);
  for(let i=1;i<L.length;i++)if(L[i].ly-L[i-1].ly<16)L[i].ly=L[i-1].ly+16;
  const over=L.length?L[L.length-1].ly-(H-8):0;if(over>0)L.forEach(l=>l.ly-=over);
  for(let i=L.length-2;i>=0;i--)if(L[i+1].ly-L[i].ly<16)L[i].ly=L[i+1].ly-16;
  const sel=lv.find(x=>x[0]===S.sel)||lv[0];
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Wave A-B-C">`;
  L.forEach(l=>{const a=l.k===sel[0]?" act":"";s+=`<line class="lvl${a}" x1="${xC}" x2="${xL-6}" y1="${l.y}" y2="${l.y}"/><path class="lvl${a}" d="M${xL-6} ${l.y} L${xL} ${l.ly}" fill="none"/><text class="lbl${a}" x="${xL+4}" y="${l.ly+4}">${l.k} ${fmt(l.v,D)}</text>`});
  s+=`<path class="leg" d="M${xA} ${y(A)} L${xB} ${y(B)} L${xC} ${y(C)}"/>`;
  s+=`<path class="proj" d="M${xC} ${y(C)} L${xT} ${y(sel[1])}"/>`;
  [["A",xA,A],["B",xB,B],["C",xC,C]].forEach(([k,x,v])=>{const above=(k==="B")===(S.dir==="up");const ty=above?y(v)-14:y(v)+24;
    s+=`<circle class="pt" cx="${x}" cy="${y(v)}" r="5"/><text class="ptl" x="${x-6}" y="${ty}">${k}</text><text class="ptv" x="${x+8}" y="${ty}">${fmt(v,D)}</text>`});
  s+=`<circle cx="${xT}" cy="${y(sel[1])}" r="5" style="fill:var(--indigo)"/>`;
  $("waveChart").innerHTML=s+"</svg>";
}

/* ---------- WIDTH ---------- */
const EQC=["#1F7A65","#24467A","#A8432F","#D9A521","#7A4FA8","#2E8FA8"];
function renderWidth(){
  const rows=S.legs.map(([a,b])=>{const x=num(a),y=num(b);return {x,y,w:Math.abs(y-x),d:Math.max(2,decs(a),decs(b)),dir:y>=x}});
  // group equal widths
  const grp=new Array(rows.length).fill(-1);let g=0;
  rows.forEach((r,i)=>{if(grp[i]>=0||!isFinite(r.w)||r.w===0)return;let found=false;
    rows.forEach((q,j)=>{if(j>i&&grp[j]<0&&isFinite(q.w)&&Math.abs(q.w-r.w)<=Math.max(r.w,q.w)*.03){grp[j]=g;found=true}});
    if(found){grp[i]=g;g++}});
  const base=rows[0]&&rows[0].w;
  let h=`<thead><tr><th>#</th><th>${t("from")}</th><th>${t("to")}</th><th class="n">${t("range")}</th><th class="n">${t("pips")} / ${t("pts")}</th><th class="n">${t("ratio")}</th><th></th></tr></thead><tbody>`;
  rows.forEach((r,i)=>{const ok=isFinite(r.w);const pi=pipInfo(r.d);
    const mark=grp[i]>=0?`<span class="eqmark" style="background:${EQC[grp[i]%EQC.length]}"></span>`:"";
    h+=`<tr><td>${mark}${i+1}</td><td><input inputmode="decimal" data-leg="${i}" data-p="0" value="${S.legs[i][0]}" aria-label="${t("from")} ${i+1}"></td><td><input inputmode="decimal" data-leg="${i}" data-p="1" value="${S.legs[i][1]}" aria-label="${t("to")} ${i+1}"></td>
    <td class="n num"><b>${ok?(r.dir?"↗ ":"↘ ")+fmt(r.w,r.d):"–"}</b></td><td class="n num">${ok?(r.w/pi.p).toFixed(pi.u==="pips"?1:r.d):"–"}</td><td class="n num">${ok&&base?(r.w/base).toFixed(3):"–"}</td>
    <td><button class="del" data-del="${i}" aria-label="−">×</button></td></tr>`});
  $("legTbl").innerHTML=h+"</tbody>";
}

/* ---------- CYCLES ---------- */
const CYC=[[9,1,"c9b","c9r"],[13,0],[17,1,"c17b","c17r"],[26,1,"c26b"],[33,0,"","c33r"],[42,0],[51,0],[65,0],[76,0],[129,0,"","c129"],[172,0],[200,0,"","c200"],[226,0],[257,0,"","c200"],[676,0]];
function cycDate(start,n){return workday(start,S.day1?n-1:n)}
function renderCycles(){
  const el=$("cycStart");if(document.activeElement!==el)el.value=S.cyc;
  const st=parseISO(S.cyc);const tb=$("cycTbl");
  if(st==null){tb.innerHTML="";$("cycLine").innerHTML="";renderSync(computeSync());return}
  const td=todayDN();const dates=CYC.map(c=>cycDate(st,c[0]));
  const nextI=dates.findIndex(d=>d>=td);
  const Y=computeSync();renderSync(Y);
  const hitOf=n=>{const e=Y.ev.find(e=>e.row===0&&e.n===n);return e&&e.hit};
  let h=`<thead><tr><th>${t("cN")}</th><th>${t("cType")}</th><th>${t("cDate")}</th><th>${t("cBull")}</th><th>${t("cBear")}</th></tr></thead><tbody>`;
  CYC.forEach((c,i)=>{const d=dates[i];const cls=d<td?"past":i===nextI?"next":"";
    h+=`<tr class="${cls}"><td class="num"><b style="font-family:var(--serif);font-size:1.1rem">${c[0]}</b></td><td><span class="tag ${c[1]?"s":""}">${t(c[1]?"simple":"complex")}</span></td>
    <td class="num" style="white-space:nowrap">${fdate(d)}${hitOf(c[0])?`<span class="cmark">${t("confMark")} ×${hitOf(c[0])}</span>`:""}<span class="when">${rel(d)}</span></td><td><span class="ds">${c[2]?t(c[2]):""}</span></td><td><span class="ds">${c[3]?t(c[3]):""}</span></td></tr>`});
  tb.innerHTML=h+"</tbody>";
  // timeline (log scale)
  const pos=n=>Math.sqrt(n)/Math.sqrt(690)*100;
  let L=`<div class="axis"></div>`;
  let lastUp=-99,lastDn=-99;
  CYC.forEach((c,i)=>{const d=dates[i];const cls=d<td?"past":i===nextI?"next":"";const x=pos(c[0]);
    let top=null;if(x-lastUp>=5.5){top=14;lastUp=x}else if(x-lastDn>=5.5){top=60;lastDn=x}
    L+=`<div class="dot ${cls}" style="left:${x}%" title="${c[0]} · ${fdate(d)}"></div>`+(top!=null?`<div class="tn" style="left:${x}%;top:${top}px">${c[0]}</div>`:"")});
  if(td>=st){const n=networkdays(st,td)-(S.day1?0:1);if(n>=1&&n<=700)L+=`<div class="today" style="left:${pos(Math.max(n,1))}%"><span>${t("today")} · ${n}</span></div>`}
  $("cycLine").innerHTML=L;
  const n=parseInt(S.custom,10),ci=$("cycCustom");if(document.activeElement!==ci)ci.value=S.custom;
  $("cycCustom").closest(".out").classList.toggle("noval",!(n>0&&n<5000));
  if(n>0&&n<5000){const d=cycDate(st,n);$("cycCustomOut").textContent=fdate(d);$("cycCustomWhen").textContent=rel(d)}else{$("cycCustomOut").textContent="–";$("cycCustomWhen").textContent=""}
}

/* ---------- CYCLE SYNC ---------- */
function bizBetween(a,b){return b<=a?0:networkdays(a+1,b)}
function computeSync(){
  const td=todayDN(),end=td+Math.round(S.sync.months*30.44);
  const lines=[{row:0,d:parseISO(S.cyc)}].concat(S.sync.rows.map((r,i)=>({row:i+1,d:parseISO(r.d)})));
  const ev=[];
  const nums=[...new Set(CYC.map(c=>c[0]).concat(syncExtra()))].sort((a,b)=>a-b);
  lines.forEach(L=>{if(L.d==null)return;nums.forEach(n=>{const d=cycDate(L.d,n);if(d>=td&&d<=end)ev.push({d,n,row:L.row})})});
  ev.sort((a,b)=>a.d-b.d||a.row-b.row);
  const conf=[];let i=0;
  while(i<ev.length){let j=i;while(j+1<ev.length&&bizBetween(ev[i].d,ev[j+1].d)<=S.sync.tol)j++;
    const g=ev.slice(i,j+1);const rows=new Set(g.map(e=>e.row));
    if(rows.size>=2){conf.push({from:g[0].d,to:g[g.length-1].d,ev:g,rows});g.forEach(e=>e.hit=rows.size)}
    i=j+1}
  return {td,end,lines,ev,conf,active:lines.filter(l=>l.d!=null).length};
}
function syncExtra(){return String(S.sync.extra||"").split(/[^0-9]+/).map(Number).filter(n=>n>0&&n<=5000)}
function escapeHtml(x){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function lineName(row){if(row===0)return t("mainLine");const r=S.sync.rows[row-1];return r&&r.l?escapeHtml(r.l):t("line",{n:row})}
function buildSyncSkeleton(){
  $("syncMonths").innerHTML=[3,6,12,24].map(n=>`<option value="${n}"${S.sync.months==n?" selected":""}>${t("mo",{n})}</option>`).join("");
  $("syncTol").innerHTML=[0,1,2,3].map(n=>`<option value="${n}"${S.sync.tol==n?" selected":""}>${n===0?t("tol0"):n===1?t("tol1"):t("tolN",{n})}</option>`).join("");
  let h=`<div class="lane"><div class="lane-in"><span class="no">0</span><div class="main" id="syncMain"></div><span></span></div><div class="track" id="trk0"></div></div>`;
  S.sync.rows.forEach((r,i)=>{h+=`<div class="lane"><div class="lane-in"><span class="no">${i+1}</span><input type="date" data-sync="${i}" data-f="d" value="${r.d}" aria-label="${t("line",{n:i+1})}"><button class="clear" data-clr="${i}" title="${t("clear")}" aria-label="${t("clear")}">×</button><input class="note" data-sync="${i}" data-f="l" value="${escapeHtml(r.l)}" placeholder="${t("labelPh")}" maxlength="40" aria-label="${t("labelPh")}"></div><div class="track" id="trk${i+1}"></div></div>`});
  $("syncLanes").innerHTML=h;
  const ex=$("syncExtra");if(document.activeElement!==ex)ex.value=S.sync.extra||"";
}
function renderSync(Y){
  const {td,end}=Y,span=end-td||1,pos=d=>(d-td)/span*100;
  const st=parseISO(S.cyc);
  $("syncMain").innerHTML=st==null?"–":`${fdate(st)}<small>${t("mainHint")}</small>`;
  const step=S.sync.months<=12?1:3;let m="",k=0;
  const d0=new Date(td*DAY);let y=d0.getUTCFullYear(),mo=d0.getUTCMonth()+1;
  for(;;){if(mo>11){mo=0;y++}const dn=Math.round(Date.UTC(y,mo,1)/DAY);if(dn>end)break;
    if(k%step===0){const lab=new Date(dn*DAY).toLocaleDateString(LOC[S.lang],{timeZone:"UTC",month:"short"})+(mo===0?" "+y:"");m+=`<span class="${(k/step)%2?"alt":""}" style="left:${pos(dn)}%">${lab}</span>`}
    mo++;k++}
  $("syncMonthsAxis").innerHTML=m;
  Y.lines.forEach(L=>{const el=$("trk"+L.row);if(!el)return;
    el.parentNode.classList.toggle("nodate",L.d==null);
    if(L.d==null){el.innerHTML="";return}
    let h=`<div class="ax"></div>`;
    Y.conf.forEach(c=>{const a=pos(c.from),b=pos(c.to);h+=`<div class="cb" style="left:calc(${a}% - 4px);width:calc(${b-a}% + 8px)"></div>`});
    const mine=Y.ev.filter(e=>e.row===L.row);
    if(!mine.length)h+=`<div class="empty"><span>${t("noFuture")}</span></div>`;
    let last=-99;
    mine.forEach(e=>{const x=pos(e.d);const hit=e.hit?" hit":"";
      h+=`<div class="sd${hit}" style="left:${x}%" title="${e.n} · ${fdate(e.d)}"></div>`;
      if(x-last>=4){h+=`<div class="sn${hit}" style="left:${Math.max(x,1.6)}%">${e.n}</div>`;last=x}});
    el.innerHTML=h});
  const box=$("confList");
  if(Y.active<2){box.innerHTML=`<div class="syncnote">${t("confNeed")}</div>`;return}
  if(!Y.conf.length){box.innerHTML=`<div class="syncnote">${t("confNone")}</div>`;return}
  let h=`<div class="scroll"><table class="conf"><thead><tr><th>${t("cDate")}</th><th class="n">${t("strength")}</th><th>${t("cycles")}</th></tr></thead><tbody>`;
  Y.conf.forEach((c,i)=>{const dt=c.from===c.to?fdate(c.from):`${fdate(c.from)} – ${fdate(c.to)}`;
    h+=`<tr class="${i===0?"first":""}"><td class="num" style="white-space:nowrap"><b>${dt}</b><span class="when">${rel(c.from)}</span></td><td class="n"><span class="pow">×${c.rows.size}</span></td><td>${c.ev.map(e=>`<span class="chip" title="${fdate(e.d)}">${lineName(e.row)} · <b>${e.n}</b></span>`).join("")}</td></tr>`});
  box.innerHTML=h+"</tbody></table></div>";
}

/* ---------- TAITO ---------- */
function renderTaito(){
  [["tbS",S.tb,"s"],["tbC",S.tb,"c"],["thS",S.th,"s"],["thC",S.th,"c"],["thH",S.th,"h"]].forEach(([id,o,k])=>{const el=$(id);if(document.activeElement!==el)el.value=o[k]});
  const one=(s,c,from,outId,whenId,cntId)=>{
    const a=parseISO(s),b=parseISO(c),f=parseISO(from);
    if(a==null||b==null||f==null||b<a){$(outId).textContent="–";$(whenId).textContent="";$(cntId).textContent="";return}
    const n=networkdays(a,b);const disp=S.day1?n:n-1;
    $(cntId).textContent=t("countIs",{n:disp})+" · "+(b-a+1)+" "+t("calDays");
    const r=workday(f,n-1);$(outId).textContent=fdate(r);$(whenId).textContent=rel(r);
  };
  one(S.tb.s,S.tb.c,S.tb.c,"tbOut","tbWhen","tbCount");
  one(S.th.s,S.th.c,S.th.h,"thOut","thWhen","thCount");
}

/* ---------- settings ---------- */
function renderSettings(){$("holStd").checked=!!S.holStd;$("day1").checked=!!S.day1;$("multChart").checked=!!S.mult;if(document.activeElement!==$("holExtra"))$("holExtra").value=S.holExtra}

function renderAll(){HOL=holSet();applyText();showTab();buildSyncSkeleton();renderTargets();renderWidth();renderCycles();renderTaito();renderSettings();save()}

/* ---------- events ---------- */
/* ---------- PRINT / PDF ---------- */
function fillPrintHead(){
  $("phLogo").src=document.querySelector(".logo img").src;
  $("phTitle").textContent=(S.pr.name||"").trim()||t("title");
  const now=new Date();
  $("phMeta").textContent=t("title")+" · Ichimoku Trader · "+t("prGenerated")+": "+now.toLocaleString(LOC[S.lang],{dateStyle:"medium",timeStyle:"short"})+" · "+location.href.split("#")[0];
  $("phNotes").textContent=(S.pr.notes||"").trim();
}
function applyPrintSel(on){
  const order=["targets","width","cycles","taito"];let first=true;
  order.forEach(k=>{const el=$("p-"+k);const off=on&&!S.pr.sec[k];el.classList.toggle("poff",off);el.classList.toggle("pfirst",!off&&first);if(!off)first=false});
  $("syncCard").classList.toggle("poff",on&&!S.pr.sec.sync);
  // sync alone without the cycles table: keep the panel but hide its table part
  const onlySync=on&&S.pr.sec.sync&&!S.pr.sec.cycles;
  if(onlySync){$("p-cycles").classList.remove("poff");$("p-cycles").classList.add("ponlysync")}else $("p-cycles").classList.remove("ponlysync");
  if(onlySync&&!order.slice(0,2).some(k=>S.pr.sec[k]))$("p-cycles").classList.add("pfirst");
  document.body.classList.toggle("printing",on);
}
function openPrint(){
  $("prName").value=S.pr.name||"";$("prName").placeholder=t("prNamePh");$("prNotes").value=S.pr.notes||"";
  document.querySelectorAll("[data-sec]").forEach(c=>c.checked=!!S.pr.sec[c.dataset.sec]);
  document.querySelectorAll('[name="prLayout"]').forEach(r=>r.checked=r.value===(S.pr.layout||"one"));
  const d=$("printDlg");if(d.showModal)d.showModal();else doPrint();
}
const PAGE_W=733,PAGE_H=1062; /* A4 minus 8 mm margins, CSS px */
function fitOnePage(){
  const w=document.querySelector("body>.wrap");w.style.zoom="";let z=1;
  for(let i=0;i<5;i++){w.style.width=(PAGE_W/z)+"px";const h=w.scrollHeight;const nz=Math.min(1,(PAGE_H*0.97)/h);if(Math.abs(nz-z)<0.003){z=nz;break}z=nz}
  w.style.width=(PAGE_W/z)+"px";w.style.zoom=z;
}
function setOnePage(on){
  const w=document.querySelector("body>.wrap");
  document.body.classList.toggle("op",on);
  let st=$("opPageStyle");
  if(on){if(!st){st=document.createElement("style");st.id="opPageStyle";st.textContent="@page{size:A4 portrait;margin:8mm}";document.head.appendChild(st)}renderTargets();fitOnePage()}
  else{if(st)st.remove();w.style.width="";w.style.zoom=""}
}
function doPrint(){
  if(!Object.values(S.pr.sec).some(Boolean)){toast(t("prNone"));return}
  const d=$("printDlg");if(d.open)d.close();
  fillPrintHead();applyPrintSel(true);
  if(S.pr.layout==="one")setOnePage(true);
  setTimeout(()=>window.print(),80);
}
window.addEventListener("beforeprint",()=>{fillPrintHead();if(!document.body.classList.contains("printing"))applyPrintSel(false)});
window.addEventListener("afterprint",()=>{setOnePage(false);applyPrintSel(false)});

function toast(m){const e=$("toast");e.textContent=m;e.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove("on"),2400)}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.lang){S.lang=b.dataset.lang;renderAll()}
  else if(b.dataset.tab){S.tab=b.dataset.tab;renderAll()}
  else if(b.dataset.dir){S.dir=b.dataset.dir;renderAll()}
  else if(b.dataset.sel){S.sel=b.dataset.sel;renderTargets();save()}
  else if(b.dataset.del!=null){S.legs.splice(+b.dataset.del,1);renderWidth();save()}
  else if(b.dataset.clr!=null){S.sync.rows[+b.dataset.clr]={d:"",l:""};buildSyncSkeleton();renderCycles();save()}
  else if(b.id==="addLeg"){S.legs.push(["",""]);renderWidth();save();const ins=document.querySelectorAll('[data-leg="'+(S.legs.length-1)+'"]');ins[0]&&ins[0].focus()}
  else if(b.id==="printBtn"){openPrint()}
  else if(b.id==="prCancel"){$("printDlg").close()}
  else if(b.id==="prGo"){doPrint()}
  else if(b.id==="themeBtn"){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark";try{localStorage.setItem("ichimokuCalc.theme",r.dataset.theme)}catch(_){}}
  else if(b.id==="shareBtn"){const enc=encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(S)))));const url=location.href.split("#")[0]+"#s="+enc;history.replaceState(null,"",url);
    (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>toast(t("copied")),()=>toast(t("copyFail")))}
  else if(b.id==="resetBtn"){const l=S.lang,tab=S.tab;S=defaults();S.lang=l;S.tab=tab;history.replaceState(null,"",location.href.split("#")[0]);renderAll()}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="inA"||el.id==="inB"||el.id==="inC"){S[S.dir][el.id.slice(2)]=el.value;renderTargets();save()}
  else if(el.dataset.leg!=null){S.legs[+el.dataset.leg][+el.dataset.p]=el.value;const pos=el.selectionStart,li=el.dataset.leg,p=el.dataset.p;renderWidth();const n=document.querySelector(`[data-leg="${li}"][data-p="${p}"]`);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}save()}
  else if(el.dataset.sync!=null){S.sync.rows[+el.dataset.sync][el.dataset.f]=el.value;renderCycles();save()}
  else if(el.id==="prName"){S.pr.name=el.value;save()}
  else if(el.id==="prNotes"){S.pr.notes=el.value;save()}
  else if(el.id==="syncExtra"){S.sync.extra=el.value;renderCycles();save()}
  else if(el.id==="cycStart"){S.cyc=el.value;renderCycles();save()}
  else if(el.id==="cycCustom"){S.custom=el.value.replace(/\D/g,"");renderCycles();save()}
  else if(["tbS","tbC"].includes(el.id)){S.tb[el.id==="tbS"?"s":"c"]=el.value;renderTaito();save()}
  else if(["thS","thC","thH"].includes(el.id)){S.th[{thS:"s",thC:"c",thH:"h"}[el.id]]=el.value;renderTaito();save()}
  else if(el.id==="holExtra"){S.holExtra=el.value;HOL=holSet();renderCycles();renderTaito();save()}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="holStd"){S.holStd=el.checked;renderAll()}
  else if(el.id==="day1"){S.day1=el.checked;renderAll()}
  else if(el.name==="prLayout"){S.pr.layout=el.value;save()}
  else if(el.dataset.sec){S.pr.sec[el.dataset.sec]=el.checked;save()}
  else if(el.id==="syncMonths"){S.sync.months=+el.value;renderCycles();save()}
  else if(el.id==="syncTol"){S.sync.tol=+el.value;renderCycles();save()}
  else if(el.id==="multChart"){S.mult=el.checked;renderTargets();save()}
});
// keyboard: arrow keys between tabs
document.querySelector("nav.tabs").addEventListener("keydown",e=>{if(!["ArrowRight","ArrowLeft"].includes(e.key))return;const tabs=[...document.querySelectorAll(".tab")];const i=tabs.indexOf(document.activeElement);if(i<0)return;const n=tabs[(i+(e.key==="ArrowRight"?1:-1)+tabs.length)%tabs.length];n.focus();n.click()});

try{const th=localStorage.getItem("ichimokuCalc.theme");if(th)document.documentElement.dataset.theme=th}catch(e){}
load();fixState();renderAll();
})();
</script>
</body>
